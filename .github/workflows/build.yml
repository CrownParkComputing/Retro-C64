name: Build

# Retains only the Android App Bundle (.aab) as a workflow artifact.
# The iOS and Linux jobs remain build/deployment checks but do not publish
# downloadable GitHub artifacts or Releases.
#
# Note on native code: libvicecore.so / libvicecore_vsid.so for arm64 are
# committed under flutter_app/android/app/src/main/jniLibs/, because building
# them from source needs the cross-compiled VICE object tree, which lives
# outside this repo (see docs/NATIVE_BUILD.md). CI therefore consumes the
# checked-in libraries rather than rebuilding them. Linux builds its own
# native libraries, which does require a VICE source tree -- that job is
# gated on one being available.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        # --no-fatal-infos: the codebase has accumulated ~10 pre-existing
        # info-level lints (empty_catches, use_build_context_synchronously,
        # deprecated_member_use on file_picker's allowMultiple, etc). They
        # are real findings and worth fixing in a follow-up, but they are
        # not errors and shouldn't block the build. Promote this back to
        # plain `flutter analyze` once the lint list is clean.
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: flutter_app
        # The suite needs no device and no native core -- anything that would
        # need libvicecore.so is faked (test/fakes/fake_vice_core.dart), so a
        # failure here is a real failure and must fail the build.
        run: flutter test

  android:
    name: Android AAB
    runs-on: ubuntu-latest
    needs: analyze
    # The `secrets` context can't be used in a step-level `if:`, so presence
    # is hoisted into a job-level env flag and tested as a string.
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify native libraries are present
        run: |
          # Fail loudly and early: without these the app builds fine and then
          # dies at runtime the moment it tries to open the core.
          for lib in libvicecore.so libvicecore_vsid.so; do
            path="flutter_app/android/app/src/main/jniLibs/arm64-v8a/$lib"
            if [ ! -f "$path" ]; then
              echo "::error::Missing native library $path (see docs/NATIVE_BUILD.md)"
              exit 1
            fi
            echo "found $path ($(du -h "$path" | cut -f1))"
          done

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Signing is optional so forks/PRs still build. With the secrets set the
      # bundle is release-signed; without them Gradle falls back to the debug
      # key (fine for testing, NOT uploadable to Play).
      - name: Set up release signing
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > flutter_app/android/app/upload-keystore.jks
          cat > flutter_app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build AAB
        working-directory: flutter_app
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS (archive + IPA)
    runs-on: macos-26
    needs: analyze
    env:
      HAS_IOS_SIGNING: ${{ secrets.APPSTORE_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Apple rejects any upload built against an iOS SDK older than 26, and
      # says so only AFTER the whole IPA has transferred. So the toolchain is
      # checked first, where it fails in seconds.
      #
      # The image default comes first deliberately: the runner carries a dozen
      # side-by-side Xcodes and only the default has its iOS platform
      # components downloaded. Picking another gets one that lists the iOS 26
      # SDK and still cannot build for a device.
      - name: Select an Xcode with the iOS 26 SDK or newer
        run: |
          set -euo pipefail
          sdk_major() {
            DEVELOPER_DIR="$1/Contents/Developer" xcodebuild -showsdks 2>/dev/null \
              | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1
          }
          pick=""
          if [ -d /Applications/Xcode.app ]; then
            v=$(sdk_major /Applications/Xcode.app || true)
            if [ -n "$v" ] && [ "$v" -ge 26 ]; then pick=/Applications/Xcode.app; fi
          fi
          if [ -z "$pick" ]; then
            for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V); do
              v=$(sdk_major "$app" || true)
              [ -n "$v" ] && [ "$v" -ge 26 ] || continue
              pick="$app"
            done
          fi
          if [ -z "$pick" ]; then
            echo "::error::No Xcode on this runner has the iOS 26 SDK."
            exit 1
          fi
          sudo xcode-select -s "$pick/Contents/Developer"
          echo "selected $pick"
          xcodebuild -version
          sdks="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          ls "$sdks" || { echo "::error::no iPhoneOS SDKs under $sdks"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # gamepads_ios has not adopted Swift Package Manager, which Flutter 3.47
      # enables by default. The mixed registrant then fails to compile for
      # device with "Module 'gamepads_ios' not found", which Flutter reports as
      # the far less specific "No Xcode build settings have been found".
      - name: Use CocoaPods rather than Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Same contract as the Android job above: the arm64 iOS cores are
      # checked in (flutter_app/ios/Frameworks) because building them needs
      # the cross-compiled VICE object tree, which is not in this repo. The
      # Runner target's "Embed Frameworks" phase copies them into
      # Runner.app/Frameworks and signs them with the app's identity.
      #
      # The FRAMEWORK bundles are what is checked, because they are what the
      # project embeds and what Dart opens. The loose .dylib beside each one
      # is the same bytes -- the build script's raw output, which the wrapper
      # is built around -- and checking it instead is why this step passed
      # while the app shipped without a core: nothing here looked at the file
      # the Runner actually carries.
      - name: Verify native libraries are present
        run: |
          for name in libvicecore libvicecore_vsid; do
            fw="flutter_app/ios/Frameworks/$name.framework"
            if [ ! -f "$fw/$name" ] || [ ! -f "$fw/Info.plist" ]; then
              echo "::error::Missing or incomplete $fw (see docs/NATIVE_BUILD.md)"
              exit 1
            fi
            echo "found $fw ($(du -h "$fw/$name" | cut -f1))"
          done

      # Unsigned build always runs, so iOS compilation breakage is caught even
      # without Apple credentials configured.
      # The committed cores must export every symbol the Dart side looks up.
      #
      # These lookups are SOFT on purpose -- a missing symbol degrades one
      # feature instead of killing the app -- which is also how a prebuilt core
      # and the bridge source drift apart in silence. Retro-C64 is the proof:
      # its core was missing vice_core_set_prg_inject, so setPrgInject did
      # nothing, the bundled demo fell back to a drive the free ROMs cannot
      # serve, and the flow the App Store notes tell Apple to follow ended at
      # "?DEVICE NOT PRESENT".
      #
      # Two details this got wrong first time round, both worth keeping:
      #   - the lookup wraps onto the next line, so the symbol has to be read
      #     from `.lookup` plus its continuation, not from any quoted string.
      #     Matching bare strings picked up prose in comments and failed the
      #     build on a symbol that never existed.
      #   - an app can ship MORE THAN ONE core, and Retro-C64 does. The symbols
      #     have to be checked against the union, or the SID player's API looks
      #     absent because it lives in the other binary.
      - name: Verify the committed cores export what Dart calls
        run: |
          set -euo pipefail
          cd flutter_app
          grep -rhA1 "\.lookup" lib/ffi/ \
            | grep -oE "'vice_[a-z_0-9]+'" | tr -d "'" | sort -u > /tmp/wanted.txt
          echo "Dart looks up $(wc -l < /tmp/wanted.txt) vice_* symbols"
          rc=0
          for slice in ios-arm64 ios-arm64-simulator; do
            : > /tmp/have.txt
            found=0
            for xc in ios/Frameworks/*.xcframework; do
              name="$(basename "$xc" .xcframework)"
              bin="$xc/$slice/$name.framework/$name"
              [ -f "$bin" ] || continue
              found=1
              nm -gU "$bin" | awk '{print $NF}' | sed 's/^_//' >> /tmp/have.txt
            done
            [ "$found" = 1 ] || { echo "::error::no cores found for $slice"; exit 1; }
            sort -u /tmp/have.txt -o /tmp/have.txt
            missing=$(comm -23 /tmp/wanted.txt /tmp/have.txt || true)
            if [ -n "$missing" ]; then
              echo "::error::$slice is stale -- no core exports:"
              echo "$missing" | while read -r s; do echo "::error::    $s"; done
              echo "::error::Rebuild from the bridge source and commit the result."
              rc=1
            else
              echo "$slice: all $(wc -l < /tmp/wanted.txt) symbols present"
            fi
          done
          exit $rc

      - name: Build iOS (no codesign)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign

      # An app that builds but ships no core installs fine and then dies at
      # "Failed to load libvicecore" on the device -- which looks like a
      # signing fault and is not one. Prove the embed phase actually ran.
      - name: Verify the core is embedded in the app
        run: |
          app=flutter_app/build/ios/iphoneos/Runner.app
          # Exactly the path VicePaths._iosFrameworkLibrary() opens at
          # runtime: Frameworks/<name>.framework/<name>. The cores ship as
          # framework bundles rather than loose dylibs because a bare dylib in
          # Frameworks/ is what the old Swift runtime looked like, and Apple's
          # validator then demands a SwiftSupport folder Xcode will not
          # generate (rejection 90426).
          for name in libvicecore libvicecore_vsid; do
            binary="$app/Frameworks/$name.framework/$name"
            if [ ! -f "$binary" ]; then
              echo "::error::$name.framework is missing from $app/Frameworks --"
              echo "::error::the Runner target's Embed Frameworks phase did not copy it."
              exit 1
            fi
            file "$binary"
            # An x86_64 slice here means a simulator core was embedded, which
            # installs on a device and then fails to load.
            case "$(file -b "$binary")" in
              *arm64*) ;;
              *) echo "::error::$name is not arm64 -- a simulator build was embedded"; exit 1 ;;
            esac
          done

      # Signed App Store build. Skipped unless the Apple secrets are set, so
      # the job still gives useful "does it compile for iOS" signal without
      # credentials. Requires: APPSTORE_CERT_BASE64 (.p12), its password, and
      # a provisioning profile.
      - name: Import signing certificate
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"     # no auto-lock mid-build
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # codesign: belongs in this list. Without it the key imports,
          # `security find-identity` calls it valid, and every signing attempt
          # fails with errSecInternalComponent -- which reads as a broken
          # certificate and is not one.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          rm cert.p12

      # A build can upload with "UPLOAD SUCCEEDED with no errors", be given a
      # delivery UUID, and then be discarded during processing -- reported by
      # email only, so CI goes green and no build ever appears. Missing purpose
      # strings (ITMS-90683) do exactly that, and file_picker embeds
      # DKImagePickerController, which links the photo library APIs whether
      # this app calls them or not.
      - name: Verify the bundle cannot be discarded in processing
        run: |
          set -euo pipefail
          plist=flutter_app/build/ios/iphoneos/Runner.app/Info.plist
          # One entry per framework that drags in a protected API, because
          # missing ANY of them is the same ITMS-90683 and each is reported
          # only after a delivery that said it succeeded. The photo library one
          # discarded the build outright; the Bluetooth one came back as a
          # warning on a delivery Apple had already accepted -- so checking
          # only the first is how the second reached a shipped build.
          need_string() {   # <framework dir> <Info.plist key>
            [ -d "flutter_app/build/ios/iphoneos/Runner.app/Frameworks/$1" ] || return 0
            /usr/bin/plutil -extract "$2" raw -o - "$plist" >/dev/null 2>&1 && return 0
            echo "::error::$1 is embedded but $2 is missing from Info.plist."
            echo "::error::Apple reports this as ITMS-90683, by email, after the upload."
            exit 1
          }
          need_string DKImagePickerController.framework NSPhotoLibraryUsageDescription
          need_string gamepads_ios.framework NSBluetoothAlwaysUsageDescription
          /usr/bin/plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$plist" >/dev/null 2>&1 \
            || { echo "::error::ITSAppUsesNonExemptEncryption is missing"; exit 1; }
          /usr/bin/plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$plist" >/dev/null 2>&1 \
            || { echo "::error::no app icon declared in the built bundle"; exit 1; }
          echo "bundle looks deliverable"

      # App Store Connect refuses a CFBundleVersion it has already seen, and
      # says so only AFTER the whole upload has transferred. A UTC timestamp is
      # monotonic without having to ask the server what it already holds.
      - name: Choose a build number
        if: env.HAS_IOS_SIGNING == 'true'
        id: buildno
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # xcodebuild archive + export, NOT `flutter build ipa`. The Runner target
      # is set to Automatic signing and `flutter build ipa` honours that: it
      # looks for a DEVELOPMENT certificate, finds none on a runner with no
      # Apple ID, and stops -- while the distribution certificate and profile
      # it actually needs sit right there, imported and installed.
      - name: Build signed IPA
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: flutter_app
        env:
          TEAM_ID: 88A3T9K9C5
          BUNDLE_ID: com.crownparkcomputing.c64-retro
          PROFILE_NAME: Retro-C64 AppStore v2
          IDENTITY: Apple Distribution
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.buildno.outputs.n }}

          # Archive UNSIGNED, then let -exportArchive do the signing. Signing
          # settings on the xcodebuild command line apply to every target in
          # the workspace, including the CocoaPods ones, and pods reject them
          # outright: "package_info_plus does not support provisioning
          # profiles", once per pod.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="$TEAM_ID"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa

          ls -l build/ios/ipa

      - name: Upload to App Store Connect
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # altool finds the key by this exact filename, derived from the key
          # id -- it is not configurable.
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d \
            > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          ipa=$(ls flutter_app/build/ios/ipa/*.ipa | head -1)
          echo "uploading $ipa"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

  linux:
    name: Linux (executable bundle)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: flutter_app
        run: flutter build linux --release

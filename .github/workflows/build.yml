name: Build

# Retains only the Android App Bundle (.aab) as a workflow artifact.
# The iOS and Linux jobs remain build/deployment checks but do not publish
# downloadable GitHub artifacts or Releases.
#
# Note on native code: libvicecore.so / libvicecore_vsid.so for arm64 are
# committed under flutter_app/android/app/src/main/jniLibs/, and the android
# job consumes them rather than spending twenty minutes cross-compiling VICE
# on every push. They can now be regenerated -- core/retro/android/
# build-vice-android-headless.sh, then core/retro/android/build.sh.
#
# That is new. The VICE source used to live outside this repository, at a path
# in one person's home directory, so for a long time NOTHING could rebuild
# these and nobody found out. The `core` job below builds VICE and the bridge
# from source on every push for exactly that reason: an unexercised build is
# one that has already rotted and not told you yet.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        # --no-fatal-infos: the codebase has accumulated ~10 pre-existing
        # info-level lints (empty_catches, use_build_context_synchronously,
        # deprecated_member_use on file_picker's allowMultiple, etc). They
        # are real findings and worth fixing in a follow-up, but they are
        # not errors and shouldn't block the build. Promote this back to
        # plain `flutter analyze` once the lint list is clean.
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: flutter_app
        # The suite needs no device and no native core -- anything that would
        # need libvicecore.so is faked (test/fakes/fake_vice_core.dart), so a
        # failure here is a real failure and must fail the build.
        run: flutter test

  android:
    name: Android AAB
    runs-on: ubuntu-latest
    needs: analyze
    # The `secrets` context can't be used in a step-level `if:`, so presence
    # is hoisted into a job-level env flag and tested as a string.
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify native libraries are present
        run: |
          # Fail loudly and early: without these the app builds fine and then
          # dies at runtime the moment it tries to open the core.
          for lib in libvicecore.so libvicecore_vsid.so; do
            path="flutter_app/android/app/src/main/jniLibs/arm64-v8a/$lib"
            if [ ! -f "$path" ]; then
              echo "::error::Missing native library $path (see docs/NATIVE_BUILD.md)"
              exit 1
            fi
            echo "found $path ($(du -h "$path" | cut -f1))"
          done

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Signing is optional so forks/PRs still build. With the secrets set the
      # bundle is release-signed; without them Gradle falls back to the debug
      # key (fine for testing, NOT uploadable to Play).
      - name: Set up release signing
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > flutter_app/android/app/upload-keystore.jks
          cat > flutter_app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build AAB
        working-directory: flutter_app
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  core:
    name: Core builds from source
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            bison flex cmake ninja-build libasound2-dev xa65 dos2unix

      - name: Build VICE headless
        run: core/retro/linux/build-vice-linux-headless.sh

      - name: Build the bridge
        run: |
          cmake -S core/retro/linux -B build-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core -j"$(nproc)"

      - name: No undefined reSIDfp symbols
        run: |
          # --without-residfp is load-bearing; see core/retro/README.md. With
          # it enabled libvicecore.so links green and fails at dlopen on a
          # device, which is the worst possible place to find out.
          fail=0
          for so in build-core/libvicecore.so build-core/libvicecore_vsid.so; do
            n=$(nm -D --undefined-only "$so" | grep -c reSIDfp || true)
            echo "$so: $n undefined reSIDfp symbols"
            [ "$n" -eq 0 ] || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "::error::core links against reSIDfp"; exit 1; }

      - name: Every symbol Dart looks up is exported
        run: |
          nm -D --defined-only build-core/libvicecore.so build-core/libvicecore_vsid.so \
            | grep ' T ' | awk '{print $3}' | grep '^vice_' | sort -u > /tmp/have.txt
          grep -rhoE "'vice_[a-z_0-9]+'" flutter_app/lib --include=*.dart \
            | tr -d "'" | sort -u > /tmp/want.txt
          missing=0
          while read -r sym; do
            # vice_core is a path segment in vice_native_paths.dart, not a symbol.
            [ "$sym" = "vice_core" ] && continue
            grep -qx "$sym" /tmp/have.txt || { echo "::error::$sym is not exported"; missing=1; }
          done < /tmp/want.txt
          echo "Dart wants $(wc -l < /tmp/want.txt), core exports $(wc -l < /tmp/have.txt)"
          [ "$missing" -eq 0 ]

  linux:
    name: Linux (executable bundle)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: flutter_app
        run: flutter build linux --release
